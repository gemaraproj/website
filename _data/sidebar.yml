# The one navigation source for the docs. The sidebar and the /docs/ landing
# both render from this file; nothing is discovered from page paths.
#
# Top-level entries are Diátaxis sections (tutorials, how-to guides, reference,
# explanation). Entries under a section may have one level of children.

- title: Tutorials
  description: Lessons that teach Gemara by doing, starting from nothing.
  url: /tutorials/
  children:
    - title: Your first control catalog
      url: /tutorials/first-control-catalog/

- title: How-to guides
  description: Step-by-step guides for writing each kind of Gemara artifact.
  url: /how-to/
  children:
    - title: Assess threats for a component
      url: /how-to/threat-assessment/
    - title: Write a control catalog
      url: /how-to/control-catalog/
    - title: Turn best practices into guidance
      url: /how-to/guidance-catalog/
    - title: Map one artifact to another
      url: /how-to/mapping-document/
    - title: Build a risk catalog
      url: /how-to/risk-catalog/
    - title: Write an organizational policy
      url: /how-to/policy/
    - title: Export to OSCAL
      url: /how-to/export-oscal/
    - title: Publish artifacts as an OCI bundle
      url: /how-to/publish-bundle/

